[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "romm-sync-engine"
version = "0.1.0"
description = "GTK-free sync engine shared by Ludo and RomM RetroArch Sync"
requires-python = ">=3.11"
authors = [{ name = 'Hector Eduardo "Covin" Silveri' }]
dependencies = [
    "requests>=2.28.0",
    "watchdog>=3.0.0",
    "cryptography>=3.4.8",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
    "py7zr",
    "qrcode>=7.4",
]

# PyGObject is deliberately absent: the engine uses GLib/Adw only when they
# already exist (GTK frontend) and falls back to headless behaviour otherwise.

[tool.setuptools.packages.find]
include = ["romm_sync_engine*"]

# The bundled Sigil build is not a Python file, so nothing includes it by
# default -- and the desktop AppImage installs this package with pip rather
# than importing the tree. Without this the library is present in git, present
# in the Decky zip, and silently absent from the AppImage, where the only
# symptom is Switch identification quietly falling back to reading filenames.
[tool.setuptools.package-data]
romm_sync_engine = ["bin/*.so", "bin/README.md"]
