name: Feature request
description: Suggest something Ludo should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        The situation, rather than the solution — it often turns out there's a
        better fix than the one either of us thought of first.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like Ludo to do?
    validations:
      required: true

  - type: dropdown
    id: shell
    attributes:
      label: Does this apply to both the Deck plugin and the desktop app?
      options:
        - Both
        - Steam Deck only
        - Desktop only
        - Not sure
